name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/farsisaz.jks

      - name: Build both editions
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleIrRelease :app:assembleGlobalRelease --no-daemon --stacktrace

      - name: Upload FarsiServ (Persian)
        uses: actions/upload-artifact@v4
        with:
          name: FarsiServ
          path: app/build/outputs/apk/ir/release/*.apk

      - name: Upload Coverlate (Global)
        uses: actions/upload-artifact@v4
        with:
          name: Coverlate
          path: app/build/outputs/apk/global/release/*.apk
